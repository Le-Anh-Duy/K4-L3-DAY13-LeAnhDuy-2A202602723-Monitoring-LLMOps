alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602723
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRateOrRetrievalFailing
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2 OR tool_success_rate_pct(retrieval) < 90'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602723
    runbook: docs/alerts.md#alert-2
  - name: CostPerRequestSpike
    severity: warning
    condition: 'avg(response_sent.cost_usd) > 0.004'
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602723
    runbook: docs/alerts.md#alert-3

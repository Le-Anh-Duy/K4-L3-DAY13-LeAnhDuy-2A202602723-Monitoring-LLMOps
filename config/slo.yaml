service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Giữ ngưỡng 3000ms / 99.5%. Baseline đo ngày 2026-09-30 (30 request, concurrency 1 và 5):
    P50 475ms, P95 785ms, P99 1136ms, TTFT P95 50ms, 0 lỗi. Ngưỡng 3000ms cao gấp ~2.6 lần P99,
    đủ chỗ cho dao động bình thường. Challenge CP3 cho thấy ngưỡng này bỏ lọt retrieval chậm
    (P95 2,666ms, 13× baseline, vẫn dưới 3000ms), nên cần thêm alert theo mức tăng so với baseline.
    Error budget 0.5% trong 28 ngày: 10,000 request thì tối đa 50 request được phép lỗi hoặc chậm hơn 3000ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
